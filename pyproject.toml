# Project metadata for the local options research CLI, which runs from the repository root.
# Runtime dependencies for the CLI are empty. The optional Jupyter environment has its
# own requirements file in notebooks/. Ruff uses the minimum supported Python version.
[project]
name = "options-lab"
version = "0.1.0"
description = "Local options data collection, valuation and synthetic replay"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
